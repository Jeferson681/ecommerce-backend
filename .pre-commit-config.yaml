repos:

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        args:
          - --fix
          - --unsafe-fixes

      - id: ruff-format

  # REMOVIDO: Black é redundante com ruff-format.
  # ruff-format é Black-compatible e executa antes.
  # Manter ambos causa loop de formatação.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        name: mypy (app)

        files: ^backend/app/modules/(?:[^/]+/(?:domain|repositories)/|[^/]+/use_cases\.py$)

        args:
          - --config-file=pyproject.toml

        additional_dependencies:
          - fastapi
          - pydantic
          - pydantic-settings
          - sqlalchemy
          - alembic
          - python-jose[cryptography]
          - passlib[bcrypt]
          - types-python-jose
          - types-passlib

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit

        files: ^backend/app/

        args:
          - -q
          - -r

        exclude: ^tests/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer

      - id: trailing-whitespace

      - id: check-added-large-files
        args: ["--maxkb=2048"]

      - id: check-merge-conflict

      - id: check-yaml

      - id: check-toml

      - id: debug-statements
