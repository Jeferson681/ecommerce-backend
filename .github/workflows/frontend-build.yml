name: Frontend Build

on:
    push:
        branches:
            - "**"
    pull_request:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: "frontend/package-lock.json"

            - name: Install dependencies
              run: |
                  cd frontend
                  npm ci --no-audit --no-fund

            - name: Build
              run: |
                  cd frontend
                  npm run build
