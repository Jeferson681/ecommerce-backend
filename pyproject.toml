[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
]

ignore = [
  "E501", # handled by Black
]

[tool.ruff.lint.isort]
combine-as-imports = true

# avoid Ruff/Black formatter conflicts
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"

# balanced baseline
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true
no_implicit_optional = true

# useful diagnostics
pretty = true
show_error_codes = true

# DO NOT enable global strict
# strict = true

# =========================
# CORE (strict typing)
# =========================
[[tool.mypy.overrides]]
module = [
  "backend.app.domain.*",
  "backend.app.services.*",
]

strict = true
check_untyped_defs = true

# =========================
# API (FastAPI / Schemas)
# =========================
[[tool.mypy.overrides]]
module = [
  "backend.app.api.*",
  "backend.app.schemas.*",
]

disallow_untyped_defs = false
disallow_untyped_calls = false
ignore_missing_imports = true
warn_return_any = false

# =========================
# INFRA (db, external deps)
# =========================
[[tool.mypy.overrides]]
module = [
  "backend.app.infrastructure.*",
]

disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = true

# =========================
# EXTERNAL LIBS
# =========================
[[tool.mypy.overrides]]
module = [
  "fastapi.*",
  "pydantic.*",
  "sqlalchemy.*",
  "alembic.*",
  "stripe",
]

ignore_missing_imports = true

# =========================
# TESTS
# =========================
[[tool.mypy.overrides]]
module = "tests.*"

disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_calls = false
ignore_missing_imports = true
warn_unused_ignores = true

# =========================
# PYTEST
# =========================
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# =========================
# COVERAGE
# =========================
[tool.coverage.run]
source = ["backend.app"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise RuntimeError",
    "raise NotImplementedError",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transactional-orders"
version = "0.0.0"
description = "Transactional orders reference implementation"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend.app*"]
