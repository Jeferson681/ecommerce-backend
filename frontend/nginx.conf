# Configuração Nginx para servir uma Single Page Application (SPA)
server {
    # Escuta na porta 80 para requisições HTTP
    listen 80;
    # Define o nome do servidor (pode ser ajustado para o domínio de produção)
    server_name localhost;

    # Define o diretório raiz onde os arquivos estáticos da aplicação estão localizados
    root /usr/share/nginx/html;
    # Define os arquivos de índice padrão
    index index.html index.htm;

    # Configuração para todas as requisições
    location / {
        # Tenta servir o arquivo diretamente, ou o diretório, ou fallback para index.html
        # Isso é crucial para o roteamento de SPAs (ex: React Router, Vue Router)
        try_files $uri $uri/ /index.html;
    }
}
