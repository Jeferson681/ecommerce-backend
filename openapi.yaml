                  message: "An internal server error occurred."

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Bearer token authentication.

        Obtain a token by calling `/auth/token` with email and password.

        Include the token in the Authorization header:
        ```
        Authorization: Bearer <access_token>
        ```

        The token contains the user ID in the `sub` claim and expires after 30 minutes by default.
